<noscript><style>.iniciar{display:none}</style><p style="text-align:center">Activa JavaScript para ver la animación y comenzar.</p></noscript>
<script>
// === CONFIGURACIÓN PARA REUTILIZAR ===
// Deja vacío para mostrar la sección #actividad de este mismo archivo.
// Para abrir otro archivo, escribe por ejemplo: "actividad.html".
const URL_ACTIVIDAD = "";

const pantalla = document.getElementById('pantalla-inicio');
const iniciar = document.getElementById('iniciar');
const repetir = document.getElementById('repetir');
const actividad = document.getElementById('actividad');
const estado = document.getElementById('estado');
const piezas = [...document.querySelectorAll('#logo-cnci path, #logo-cnci polygon')];
const reducir = matchMedia('(prefers-reduced-motion: reduce)');
let animaciones = [];
let ejecucion = 0;
let entrando = false;

// Cada letra tiene su propio tiempo. Los puntos de las íes acompañan a su letra.
const tiempos = {
 'piece-9':250, 'piece-8':570, 'piece-10':390, 'piece-11':740,
 'piece-13':920, 'piece-14':650, 'piece-16':500, 'piece-17':500,
 'piece-20':180, 'piece-19':370, 'piece-30':370, 'piece-26':290,
 'piece-24':530, 'piece-27':410, 'piece-25':640, 'piece-28':470,
 'piece-29':470, 'piece-21':720, 'piece-23':560, 'piece-22':810,
 'piece-32':1250,'piece-35':1000,'piece-38':1150,'piece-39':1050,
 'piece-36':1270,'piece-33':1100,'piece-34':1370,'piece-37':1200
};
async function animarLogo(){
 const actual = ++ejecucion;
 animaciones.forEach(a=>a.cancel());
 animaciones=[];
 iniciar.classList.remove('listo');
 iniciar.disabled=true; repetir.disabled=true;
 estado.textContent='Dibujando el logo de CNCI.';
 const promesas=[];
 piezas.forEach(pieza=>{
  const longitud=pieza.getTotalLength();
  const caja=pieza.getBBox();
  const demora=tiempos[pieza.id]??500;
  const duracion=caja.height>120?2100:1450;
  pieza.style.strokeDasharray=`${longitud} ${longitud}`;
  const trazo=pieza.animate([
   {strokeDashoffset:longitud,strokeOpacity:1},
   {strokeDashoffset:0,strokeOpacity:1}
  ],{duration:reducir.matches?1:duracion,delay:reducir.matches?0:demora,easing:'ease-in-out',fill:'both'});
  const relleno=pieza.animate([
   {fillOpacity:0},{fillOpacity:1}
  ],{duration:reducir.matches?1:1100,delay:reducir.matches?0:demora+duracion*.52,easing:'ease-in-out',fill:'both'});
  animaciones.push(trazo,relleno);
  promesas.push(trazo.finished,relleno.finished);
 });
 await Promise.all(promesas).catch(()=>{});
 if(actual!==ejecucion)return;
 iniciar.disabled=false; repetir.disabled=false;
 iniciar.classList.add('listo');
 estado.textContent='Todo listo. Presiona Iniciar para abrir la actividad.';
}
iniciar.addEventListener('click',()=>{
 if(entrando || iniciar.disabled)return;
 entrando=true; iniciar.disabled=true; repetir.disabled=true;
 pantalla.classList.add('saliendo');
 setTimeout(()=>{
  if(URL_ACTIVIDAD){window.location.assign(URL_ACTIVIDAD);return;}
  pantalla.hidden=true; actividad.hidden=false;
  document.getElementById('titulo-actividad').focus();
  entrando=false;
 },reducir.matches?0:400);
});
repetir.addEventListener('click',animarLogo);
document.getElementById('volver').addEventListener('click',()=>{
 actividad.hidden=true; pantalla.hidden=false;
 pantalla.classList.remove('saliendo');
 animarLogo();
});
animarLogo();
</script>
</body>
</html>
